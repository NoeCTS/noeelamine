          var NAME = "                   ##\n                  ##\n##   ##  #####  #######         ####### ##       #####  ##   ## ####### ##   ## #######\n###  ## ##   ## ##              ##      ##      ##   ## ### ###   ###   ###  ## ##\n#### ## ##   ## ##              ##      ##      ##   ## #######   ###   #### ## ##\n## #### ##   ## #####           #####   ##      ####### ## # ##   ###   ## #### #####\n##  ### ##   ## ##              ##      ##      ##   ## ##   ##   ###   ##  ### ##\n##   ## ##   ## ##              ##      ##      ##   ## ##   ##   ###   ##   ## ##\n##   ##  #####  #######         ####### ####### ##   ## ##   ## ####### ##   ## #######";
          var RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
          var ink = {};
          for (var r = 0; r < RAMP.length; r++) ink[RAMP.charAt(r)] = r;

          var rows = FACE.split("\n");
          var wide = rows[0].length;
          // Average the ink over an n-by-n block and pick the character that
          // carries it. Sampling every nth glyph instead would drop detail
          // rather than summarise it, and the coarse frames would come out as
          // noise instead of a face.
          var coarse = function (n) {
            var out = [];
            for (var y = 0; y < rows.length; y += n) {
              var line = "";
              for (var x = 0; x < wide; x += n) {
                var sum = 0, seen = 0;
                for (var dy = 0; dy < n && y + dy < rows.length; dy++) {
                  for (var dx = 0; dx < n && x + dx < wide; dx++) {
                    sum += ink[rows[y + dy].charAt(x + dx)] || 0;
                    seen++;
                  }
                }
                line += RAMP.charAt(Math.round(sum / (seen || 1)));
              }
              out.push(line);
            }
            return out.join("\n");
          };

          var nameRows = NAME.split("\n");
          var nameWide = Math.max.apply(null, nameRows.map(function (r) { return r.length; }));

          var grid = [7, 7, 6, 5, 5, 4, 4, 3, 3, 2, 2, 1, 1];
          var step = -1;
          var beat = setInterval(function () {
            step++;
            var n = grid[step];
            console.clear();
            console.log(
              "%c" + coarse(n),
              "color:#8A8A92;font-family:ui-monospace,monospace;line-height:1.05;font-size:" + n * 7 + "px"
            );
            console.log(
              "%c" + nameRows.map(function (r) {
                return r.slice(0, Math.round(((step + 1) / grid.length) * nameWide)).replace(/\s+$/, "");
              }).join("\n"),
              "color:#F2F0EC;font-family:ui-monospace,monospace;line-height:1;font-size:9px"
            );
            if (step >= grid.length - 1) {
              clearInterval(beat);
              console.log(
                "%cAn archive of my work.  noeelamine.com",
                "color:#8A8A92;font-family:ui-monospace,monospace;font-size:11px"
              );
            }
          }, 85);
        } catch (e) {}
      })();
